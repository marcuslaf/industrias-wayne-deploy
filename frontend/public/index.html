<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indústrias Wayne - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235B21B6'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h2v-6h-2v6zm0-8h2V7h-2v2z'/%3E%3C/svg%3E">
</head>
<body>
    <main>
        <div class="container auth-container">
            <h2>Bem-vindo às Indústrias Wayne</h2>
            <p style="color: var(--color-text-medium); margin-bottom: var(--spacing-lg);">Faça login para acessar o sistema de segurança e recursos.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuário:</label>
                    <input type="text" id="username" name="username" required placeholder="Ex: admin, gerente, funcionario">
                </div>

                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required placeholder="Ex: admin123, gerente123, funcionario123">
                </div>

                <button type="submit">Entrar</button>
            </form>
            <div id="message" class="message hidden" role="alert" aria-live="polite"></div>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
